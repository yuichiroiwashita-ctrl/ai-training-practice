<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>お問い合わせ（練習用フォーム）</title><meta name="robots" content="noindex"><link rel="stylesheet" href="style.css"></head><body>
<header>サンプル商事 お問い合わせ</header>
<main>
<div class="note">これはAI研修用の練習フォームです。送信してもどこにも送られません。</div>
<h1>お問い合わせフォーム</h1>
<form id="f" onsubmit="event.preventDefault();alert('研修用のため、送信されません。');">
<div class="row"><label class="t">ご用件<span class="req">必須</span></label><div class="radios">
<label><input type="radio" name="y" checked> 資料請求</label><label><input type="radio" name="y"> お見積り</label><label><input type="radio" name="y"> サービスについて</label><label><input type="radio" name="y"> その他お問い合わせ</label></div></div>
<div class="row"><label class="t" for="n">お名前<span class="req">必須</span></label><input id="n" type="text"></div>
<div class="row"><label class="t" for="k">お名前（フリガナ）</label><input id="k" type="text"></div>
<div class="row"><label class="t" for="c">所属（会社・団体名など）<span class="req">必須</span></label><input id="c" type="text"></div>
<div class="row"><label class="t" for="m">メールアドレス<span class="req">必須</span></label><input id="m" type="email"></div>
<div class="row"><label class="t" for="t">電話番号<span class="req">必須</span></label><input id="t" type="tel" placeholder="例）000-0000-0000"></div>
<div class="row"><label class="t" for="b">お問い合わせ内容<span class="req">必須</span></label><textarea id="b"></textarea></div>
<div class="row"><label class="t">個人情報の取り扱い</label><label><input type="checkbox"> プライバシーポリシーに同意する</label></div>
<button type="submit">送信する</button>
</form></main></body></html>
